# Overlay: docker compose -f docker-compose.release.yml -f docker-compose.mosquitto.yml up -d --build
services:
  api:
    environment:
      MQTT_DYNSEC_ENABLED: "true"
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:?Set MQTT_BROKER_URL to the portal broker endpoint}
      MQTT_DYNSEC_USERNAME: dp-sync
      MQTT_DYNSEC_PASSWORD_FILE: /run/secrets/mqtt_dynsec_password
      MQTT_BROKER_USERNAME: ${MQTT_BROKER_USERNAME:?Set MQTT_BROKER_USERNAME to the portal service account}
      MQTT_BROKER_PASSWORD_FILE: /run/secrets/mqtt_backend_password
      MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:?Set MQTT_PUBLIC_HOST to the TLS certificate hostname}
      MQTT_PUBLIC_PORT: ${MQTT_PUBLIC_PORT:-8883}
    secrets:
      - mqtt_dynsec_password
      - mqtt_backend_password
    networks:
      - default
      - mqtt-internal
    depends_on:
      mosquitto:
        condition: service_started

  mosquitto-init:
    image: node:24-alpine
    network_mode: none
    command: ["node", "/setup/init-dynsec.cjs"]
    volumes:
      - ./mosquitto/init-dynsec.cjs:/setup/init-dynsec.cjs:ro
      - mosquitto-data:/mosquitto/data
    secrets:
      - mqtt_dynsec_password
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2.1.2
    networks:
      - mqtt-internal
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "127.0.0.1:${MQTT_PROXY_PORT:-1883}:1883"
    restart: unless-stopped

volumes:
  mosquitto-data:

networks:
  mqtt-internal:

secrets:
  mqtt_dynsec_password:
    file: ./secrets/mqtt-dynsec-password
  mqtt_backend_password:
    file: ./secrets/mqtt-backend-password
